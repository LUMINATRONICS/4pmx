        <!-- Hidden inputs for JS compatibility -->

        <!-- ... -->

            <span class="toggle-label">간이 설문 모드</span>

        </form>

    <script src="static/NPS.js"></script>
    <script>
        // Helper function to handle button clicks and update hidden radios
        function selectRadio(name, value, btnElement) {
            // Update hidden radio
            const radios = document.getElementsByName(name);
            for (let radio of radios) {
                if (radio.value === value) {
                    radio.checked = true;
                    break;
                }
            }

            // Update visual state
            const container = btnElement.parentElement;
            const siblings = container.children;
            for (let sib of siblings) {
                sib.classList.remove('selected');
            }
            btnElement.classList.add('selected');
        }
    </script>
