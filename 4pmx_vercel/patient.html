<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4PMx Pain Meter Q™ - Main Page</title>
    <link rel="icon" href="data:," type="image/x-icon" />
    <link rel="stylesheet" href="static/style/patient.css" />
    <link rel="stylesheet" href="static/style/fonts.css">
    <link rel="stylesheet" href="static/style/all.min.css">
    <link rel="stylesheet" href="static/style/quick_menu.css">
    <script type="module" src="static/patient.js"></script>
    <script type="module" src="static/pagelock.js"></script>
</head>

<body>
    <!-- ... -->
    <header>
        <div class="header-left">
            <span class="header-title"> 메인 페이지 </span>
        </div>
        <div class="header-right">
            <!-- 관리자 버튼 그룹 (권한에 따라 보임/숨김) -->
            <div id="admin-buttons-container" class="admin-group" style="display: none;">
                <button id="view-logs-btn" class="btn btn-ghost" title="로그 보기" onclick="location.href='logs.html'"><i
                        class="fa-solid fa-file-lines"></i>
                    로그</button>
                <button id="restore-btn" class="btn btn-ghost" style="display: none;" title="복원"><i
                        class="fa-solid fa-undo"></i></button>
                <button id="backup-btn" class="btn btn-ghost" style="display: none;" title="백업"><i
                        class="fa-solid fa-save"></i></button>
                <button id="doctormanage" class="btn btn-ghost" title="사용자 관리"
                    onclick="location.href='doctorlist.html'"><i class="fa-solid fa-user-doctor"></i>
                    사용자 관리</button>
            </div>

            <button id="logoutBtn" class="btn btn-danger" onclick="location.href='index.html'">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃
            </button>
        </div>
    </header>

    <main>
        <!-- ... -->
        <div class="action-bar">
            <!-- ... -->
        </div>

        <div class="card">
            <div class="table-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th width="10%">선택</th>
                            <th width="22%">검사 일시</th>
                            <th width="12%">성명</th>
                            <th width="8%">성별</th>
                            <th width="8%">나이</th>
                            <th width="auto">파일명</th>
                            <th width="12%">리포트</th>
                        </tr>
                    </thead>
                    <tbody id="csv-list">
                        <!-- Static dummy data for Vercel demo -->
                        <tr>
                            <td><input type="checkbox"></td>
                            <td>2024-01-30 14:00</td>
                            <td>홍길동</td>
                            <td>남</td>
                            <td>30</td>
                            <td>data_20240130_hong.csv</td>
                            <td><button class="btn btn-sm">View</button></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox"></td>
                            <td>2024-01-29 10:30</td>
                            <td>김철수</td>
                            <td>남</td>
                            <td>45</td>
                            <td>data_20240129_kim.csv</td>
                            <td><button class="btn btn-sm">View</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination-container">
                <div id="pagination" class="pagination"></div>
            </div>
        </div>
    </main>

    <!-- ... -->
    <div id="patient-modal" class="modal" style="display: none;">
        <!-- ... -->
    </div>

    <!-- Quick Menu -->
    <div id="quick-menu-container">
        <div id="quick-menu">
            <a href="index.html"><span>🏠</span><span>Main</span></a>
            <a href="login.html"><span>🔑</span><span>Login</span></a>
            <a href="patient.html"><span>👤</span><span>Patient</span></a>
            <a href="control.html"><span>🎮</span><span>Control</span></a>
            <a href="result.html"><span>📈</span><span>Result</span></a>
            <a href="logs.html"><span>📋</span><span>Logs</span></a>
        </div>
    </div>
</body>

</html>
