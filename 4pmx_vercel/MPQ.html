<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>맥길통증설문(MPQ)</title>
    <!-- 폰트 및 아이콘 -->
    <link rel="stylesheet" href="static/css/all.min.css">
    <link rel="stylesheet" href="static/style/MPQ.css">
    <link rel="stylesheet" href="static/css/fonts.css">
    <link rel="stylesheet" href="static/style/quick_menu.css">
    <script src="static/pagelock.js"></script>
    <script type="module" src="static/pagelock.js"></script>
</head>

<body>

    <!-- 1. 헤더: 네비게이션 역할 -->
    <header>
        <div class="header-left">
            <button class="back-btn" onclick="history.back()">
                <!-- SVG Back Icon -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
        </div>
        <div class="header-title">맥길통증설문(MPQ)</div>
        <div class="header-right">
            <div class="logo">
                <img src="static/resources/CI.png" alt="4PMX">
            </div>
        </div>
    </header>

    <!-- 2. 정보바: 환자 정보 -->
    <div class="info-bar">
        <div class="patient-info">
            <div class="info-item">
                <span class="info-label">날짜</span>
                <span class="info-value">2024-01-30</span>
            </div>
            <div class="divider"></div>
            <div class="info-item">
                <span class="info-label">성명</span>
                <span class="info-value">홍길동</span>
            </div>
            <div class="divider"></div>
            <div class="info-item">
                <span class="info-label">성별</span>
                <span class="info-value">남</span>
            </div>
            <div class="divider"></div>
            <div class="info-item">
                <span class="info-label">나이</span>
                <span class="info-value">30세</span>
            </div>
        </div>

        <!-- Hidden inputs for JS compatibility -->
        <input type="hidden" name="date" value="2024-01-30">
        <input type="hidden" name="name" value="홍길동">
        <input type="hidden" name="age" value="30">
        <div style="display:none;">
            <input type="radio" name="gender" value="남" checked>
            <input type="radio" name="gender" value="여">
        </div>
        <!-- ... -->
    </div>

    <!-- ... -->
    <main>
        <form onsubmit="alert('Demo: Submitted'); return false;">
            <!-- 설문 문항 컨테이너 -->
            <div id="mpqQuestions"></div>

            <!-- 제출 버튼 -->
            <div class="submit-area">
                <button type="submit" class="submit-btn" name="exppage-startexp">제출하기</button>
            </div>
        </form>
    </main>

    <!-- JS 파일 로드 -->
    <script src="static/MPQ.js"></script>

    <!-- Quick Menu -->
    <div id="quick-menu-container">
        <div id="quick-menu">
            <a href="index.html"><span>🏠</span><span>Main</span></a>
            <a href="login.html"><span>🔑</span><span>Login</span></a>
            <a href="patient.html"><span>👤</span><span>Patient</span></a>
            <a href="control.html"><span>🎮</span><span>Control</span></a>
            <a href="result.html"><span>📈</span><span>Result</span></a>
            <a href="logs.html"><span>📋</span><span>Logs</span></a>
        </div>
    </div>
</body>

</html>
