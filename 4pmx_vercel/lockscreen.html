<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>세션 잠금</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/lockscreen.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <script type="module" src="{{ url_for('static', filename='pagelock.js') }}"></script>
</head>

<body>
    <div class="lock-wrapper">
        <div class="lock-container">
            <h1>세션이 잠금 상태입니다</h1>
            <input type="password" id="unlock-password" maxlength="24" placeholder="비밀번호 입력" />
            <div class="error-message" id="lock-error"></div>
            <button id="unlock-button">잠금 해제</button>

        </div>
    </div>

    <script src="{{ url_for('static', filename='lockscreen.js') }}"></script>
</body>

</html>
