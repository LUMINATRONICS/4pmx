<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원격 검사 설정</title>
    <link rel="stylesheet" href="static/style/all.min.css">
    <link rel="stylesheet" href="static/style/control.css">
    <link rel="stylesheet" href="static/style/fonts.css">
    <link rel="stylesheet" href="static/style/quick_menu.css">
    <script src="static/scriptJs/socket.io.min.js"></script>
    <script src="static/scriptJs/chart.js"></script>
    <script src="static/js/lordicon.js"></script>
    <script type="module" src="static/control.js"></script>
    <script type="module" src="static/pagelock.js"></script>
</head>

<body>
    <header>
        <div class="header-left">
            <button class="back-btn" onclick="history.back()" id="backBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <span class="header-title">검사 설정</span>
        </div>
        <div class="header-right">
            <div class="connection-status disconnected" id="connectionStatus" onclick="handleConnectionClick()"
                style="cursor: pointer;">
                <div class="status-dot"></div>
                <span id="port_info">Disconnected</span>
            </div>
            <button id="logoutBtn" class="btn btn-danger" onclick="location.href='index.html'">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃
            </button>
        </div>
    </header>

    <!-- ... (rest of main) ... -->
    <main>
        <!-- ... -->
        <input type="hidden" id="custom_delay" value="5">
        <input type="hidden" id="baud_rate" value="500000">
        <input type="hidden" id="buttonClickCount" value="12">
        <p id="date" class="user_info" style="display: none;"></p>
        <p id="name" class="user_info" style="display: none;"></p>
        <p id="gender" class="user_info" style="display: none;"></p>
        <p id="age" class="user_info" style="display: none;"></p>
    </main>
    <!-- ... -->
    <footer>
        <div class="footer-left">
            <!-- ... -->
        </div>
    </footer>

    <!-- Quick Menu -->
    <div id="quick-menu-container">
        <div id="quick-menu">
            <a href="index.html"><span>🏠</span><span>Main</span></a>
            <a href="login.html"><span>🔑</span><span>Login</span></a>
            <a href="patient.html"><span>👤</span><span>Patient</span></a>
            <a href="control.html"><span>🎮</span><span>Control</span></a>
            <a href="result.html"><span>📈</span><span>Result</span></a>
            <a href="logs.html"><span>📋</span><span>Logs</span></a>
        </div>
    </div>
</body>

</html>
