<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4PMx 통증다원검사 결과</title>
    <script src="static/scriptJs/papaparse.min.js"></script>
    <script src="static/scriptJs/chart.js"></script>
    <link rel="stylesheet" href="static/style/result.css">
    <link rel="stylesheet" href="static/css/fonts.css">
    <link rel="stylesheet" href="static/style/quick_menu.css">
    <script type="module" src="static/result.js"></script>
    <script type="module" src="static/pagelock.js"></script>
</head>

<body file-name="dummy_data.csv">
    <div id="result_wrap">
        <!-- 헤더: CI 로고 및 사용자 정보 -->
        <div id="titleDiv">
            <div id="title">
                <img id="ci-logo" src="static/resources/CI.png" alt="CI Logo">
                <h1>통증다원검사 결과</h1>
            </div>
            <!-- ... -->
        </div>

        <!-- ... -->

        <!-- AI 확률 그래프 -->
        <div class="ai-probability-container">
            <div class="prob-labels-row">
                <span class="prob-label-left">환자일 확률</span>
                <span class="prob-label-right">정상일 확률</span>
            </div>

            <div class="prob-bars-row">
                <!-- 왼쪽: 환자 확률 (Red) -->
                <div class="prob-half left">
                    <!-- 배경 및 바 -->
                    <div class="prob-bar-bg">
                        <div class="prob-bar-fill patient" style="width: 70%;">
                            <span class="prob-value">70</span>
                        </div>
                    </div>
                </div>

                <!-- 오른쪽: 정상 확률 (Blue) -->
                <div class="prob-half right">
                    <!-- 배경 및 바 -->
                    <div class="prob-bar-bg">
                        <div class="prob-bar-fill normal" style="width: 30%;">
                            <span class="prob-value">30</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="prob-axis-row">
                <span class="axis-end">100</span>
                <span class="axis-center">0</span>
                <span class="axis-end">100</span>
            </div>
        </div>

        <div id="ai-summary-opinion" class="summary-box"
            style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>AI 분석 결과: 통증 민감도가 높게 측정되었습니다.</div>
            <div>추가 정밀 검사가 권장됩니다.</div>
        </div>

        <div id="backup-section" style="display:none;">
            <button id="backup" class="backup-button">저장</button>
            <input type="password" id="verify-password" maxlength="24" placeholder="비밀번호 입력" />
            <div id="backup-result"></div>
        </div>

        <div class="bottom-buttons-container">
            <button id="resultPatientListBtn" class="purple-btn" onclick="location.href='patient.html'">환자 리스트</button>
            <button id="resultLogoutBtn" class="purple-btn" onclick="location.href='index.html'">로그아웃</button>
        </div>
    </div>

    <!-- Quick Menu -->
    <div id="quick-menu-container">
        <div id="quick-menu">
            <a href="index.html"><span>🏠</span><span>Main</span></a>
            <a href="login.html"><span>🔑</span><span>Login</span></a>
            <a href="patient.html"><span>👤</span><span>Patient</span></a>
            <a href="control.html"><span>🎮</span><span>Control</span></a>
            <a href="result.html"><span>📈</span><span>Result</span></a>
            <a href="logs.html"><span>📋</span><span>Logs</span></a>
        </div>
    </div>
</body>

</html>
