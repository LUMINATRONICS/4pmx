<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4PMx Pain Meter Q™ - History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/csv.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <script type="module" src="{{ url_for('static', filename='csv.js') }}"></script>
</head>

<body>
    <h1>Test History Management</h1>
    <div class="search-container">
        <input type="text" id="search" placeholder="Search CSV File Name">
        <button id="search-button">Search</button>
        <button id="cancel-button">Cancel Search</button>
        <select id="sort">
            <option value="latest">최신순</option>
            <option value="oldest">오래된순</option>
        </select>
    </div>
    <div class="filter-container">
        <input type="date" id="date-filter">
        <input type="text" id="time-filter" placeholder="Filter by Time">
        <input type="text" id="name-filter" placeholder="Filter by Name">
        <select id="gender-filter">
            <option value="">All</option>
            <option value="남">남</option>
            <option value="여">여</option>
        </select>
        <input type="number" id="age-filter" placeholder="Filter by Age">
        <button id="reset-button">Reset Filters</button>
    </div>
    <table id="csv-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Name</th>
                <th>Gender</th>
                <th>Age</th>
                <th>File Name</th>
                <th>Result</th>
                <th>Process</th>
            </tr>
        </thead>
        <tbody id="csv-list"></tbody>
    </table>
</body>

</html>
