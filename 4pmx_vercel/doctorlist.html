<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 관리 - 4PMx Pain Meter Q™</title>
    <link rel="stylesheet" href="static/style/doctorlist.css" />
    <link rel="stylesheet" href="static/style/fonts.css">
    <link rel="stylesheet" href="static/style/all.min.css">
    <link rel="stylesheet" href="static/style/quick_menu.css">
    <script type="module" src="static/doctorlist.js"></script>
    <script type="module" src="static/pagelock.js"></script>
</head>

<body>
    <!-- 헤더 -->
    <header>
        <div class="header-left">
            <button class="back-btn" onclick="history.back()">
                <!-- SVG Back Icon -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <span class="header-title">사용자 관리</span>
        </div>
        <div class="header-right">
            <button id="logoutBtn" class="btn btn-danger" onclick="location.href='index.html'">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃
            </button>
        </div>
    </header>

    <main>
        <!-- ... -->
        <!-- 사용자 리스트 테이블 카드 -->
        <div class="card">
            <div class="table-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th width="15%">권한</th>
                            <th width="10%">선택</th>
                            <th width="35%">이름</th>
                            <th width="40%">아이디</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Static Demo Data -->
                        <tr>
                            <td><span class="badge admin">관리자</span></td>
                            <td><input type="checkbox"></td>
                            <td>관리자</td>
                            <td>admin</td>
                        </tr>
                        <tr>
                            <td><span class="badge">일반</span></td>
                            <td><input type="checkbox"></td>
                            <td>테스트의사</td>
                            <td>doctor1</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ... (Modals) ... -->

    <!-- Quick Menu -->
    <div id="quick-menu-container">
        <div id="quick-menu">
            <a href="index.html"><span>🏠</span><span>Main</span></a>
            <a href="login.html"><span>🔑</span><span>Login</span></a>
            <a href="patient.html"><span>👤</span><span>Patient</span></a>
            <a href="control.html"><span>🎮</span><span>Control</span></a>
            <a href="result.html"><span>📈</span><span>Result</span></a>
            <a href="logs.html"><span>📋</span><span>Logs</span></a>
        </div>
    </div>
</body>

<!-- 삭제 확인 모달 -->
<div id="confirm-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>사용자 삭제</h3>
            <span class="close-btn" id="confirm-close">&times;</span>
        </div>
        <p>선택한 의사 정보를 삭제하시겠습니까?</p>
        <div class="modal-buttons" style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: flex-end;">
            <button id="confirm-no" class="btn btn-ghost">취소</button>
            <button id="confirm-yes" class="btn btn-danger">삭제</button>
        </div>
    </div>
</div>

<!-- 비밀번호 변경 모달 -->
<div id="change-password-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>비밀번호 변경</h3>
            <span class="close-btn" id="change-pw-close">&times;</span>
        </div>
        <div class="input-group">
            <label>기존 비밀번호</label>
            <input type="password" id="current-password-input" maxlength="24" placeholder="기존 비밀번호">
        </div>
        <div class="input-group">
            <label>새 비밀번호</label>
            <input type="password" id="new-password-input" maxlength="24" placeholder="새 비밀번호 (8~24자, 영문/숫자/특수문자 포함)">
        </div>
        <div class="input-group">
            <label>새 비밀번호 확인</label>
            <input type="password" id="new-password-confirm-input" maxlength="24" placeholder="새 비밀번호 확인">
        </div>
        <div class="modal-buttons" style="margin-top: 1rem;">
            <button id="change-password-confirm" class="btn btn-primary full-width">변경 확인</button>
            <button id="change-password-cancel" class="btn btn-ghost full-width" style="margin-top: 0.5rem;">취소</button>
        </div>
    </div>
</div>

<!-- 사용자 추가 모달 -->
<div id="add-user-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>새 사용자 추가</h3>
            <span class="close-btn" id="add-user-close">&times;</span>
        </div>
        <div class="input-group">
            <label>이름</label>
            <input type="text" id="add-name-input" maxlength="24" placeholder="이름 (한글/영문)">
        </div>
        <div class="input-group">
            <label>아이디</label>
            <input type="text" id="add-id-input" maxlength="24" placeholder="아이디">
        </div>
        <div class="input-group">
            <label>비밀번호</label>
            <input type="password" id="add-password-input" maxlength="24" placeholder="비밀번호 (8~24자, 영문/숫자/특수문자 포함)">
        </div>
        <div class="input-group">
            <label>비밀번호 확인</label>
            <input type="password" id="add-password-confirm-input" maxlength="24" placeholder="비밀번호 확인">
        </div>
        <div class="input-group" style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" id="add-isadmin-toggle" style="width: auto;">
            <label for="add-isadmin-toggle" style="margin: 0;">관리자 권한 부여</label>
        </div>

        <div class="modal-buttons" style="margin-top: 1rem;">
            <button id="add-user-confirm" class="btn btn-primary full-width">추가</button>
            <button id="add-user-cancel" class="btn btn-ghost full-width" style="margin-top: 0.5rem;">취소</button>
        </div>
    </div>
</div>

<!-- 사용자 수정 모달 -->
<div id="edit-user-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>사용자 정보 수정</h3>
            <span class="close-btn" id="edit-user-close">&times;</span>
        </div>
        <div class="input-group">
            <label>이름</label>
            <input type="text" id="edit-name-input" maxlength="24" placeholder="이름">
        </div>
        <div class="input-group" style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" id="edit-isadmin-toggle" style="width: auto;">
            <label for="edit-isadmin-toggle" style="margin: 0;">관리자 권한 부여</label>
        </div>

        <div class="modal-buttons" style="margin-top: 1rem;">
            <button id="edit-user-confirm" class="btn btn-primary full-width">수정 확인</button>
            <button id="edit-user-cancel" class="btn btn-ghost full-width" style="margin-top: 0.5rem;">취소</button>
        </div>
    </div>
</div>

</body>

</html>
